[General]
# Backdrop: "aurora" (animated OPOS gradient), an image path, or a video path (.mp4/.webm/.mov/.mkv)
# for an aerial loop. Relative paths resolve against the theme directory.
background=aurora
# 0.0 – 1.0 darkening applied over images/videos for legibility
backgroundDim=0.35

# Palette
accentColor=#7c8cff
accentColor2=#f472b6
accentColor3=#22d3ee
baseColor=#0a0a0f

# Typography (falls back to the system sans-serif if not installed)
font=Inter

# Clock (Qt date/time format strings)
clockFormat=HH:mm
dateFormat=dddd, MMMM d
showGreeting=true

# Convergence: consecutive arrow/enter presses that switch into TV (remote) mode
tvKeyThreshold=2

# Status pills
showHostname=true
showBattery=true
showNetwork=true

# Glass
blurMax=64
